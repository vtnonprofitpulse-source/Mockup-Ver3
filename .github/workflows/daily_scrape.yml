name: Daily VNP Scraper

on:
  # NOTE: GitHub's free scheduled workflows typically run 2-2.5 hours late.
  # 7:30 UTC = 3:30am Eastern nominal trigger, targeting ~6am Eastern actual
  # completion. Original value was '0 10 * * *' (targeted 6am ET, actually
  # landed ~8:15-8:30am ET) - revert to that at beta if this schedule ever
  # becomes less important to hit early.
  schedule:
    - cron: '30 7 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0

      - name: Set up Python
        uses: actions/setup-python@65d7f2d534ac1bc67fcd62888c5f4f3d2cb2b236 # v4.7.1
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install psycopg2-binary==2.9.12 requests==2.34.2 beautifulsoup4==4.15.0 anthropic==1.0.0 pdfplumber==0.11.10 python-dateutil==2.9.0.post0

      - name: Run scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          APIFY_API_KEY: ${{ secrets.APIFY_API_KEY }}
        run: python scraper.py

      - name: Create issue on failure
        if: failure()
        uses: JasonEtco/create-an-issue@1b14a70e4d8dc185e5cc76d3bec9eab20257b2c5 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
